[package]
name = "lloyds-tracker"
version = "1.6.0"
edition = "2021"
rust-version = "1.80"
description = "Lloyds Tracker — praćenje vremena u traci (Linux port)"
license = "MIT"

[[bin]]
name = "lloyds-tracker"
path = "src/main.rs"

[dependencies]
# GTK4 za prozore. Feature v4_10 je zbog gtk::FileDialog (export CSV) — vidi README,
# minimalni GTK je 4.10 (Ubuntu 24.04 ima 4.14, Fedora 40+ 4.14, Debian 13 4.18).
gtk4 = { version = "0.11", features = ["v4_10"] }

# Tray preko StatusNotifierItem-a (KDE spec). Pure-Rust, bez libappindicator C ovisnosti.
# Blocking API jer GTK drži main thread; async-io umjesto tokija da ne vučemo runtime.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

# Idle (Mutter/ScreenSaver) i lock (logind). Isti async-io runtime kao ksni.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# Tray thread → GTK main thread; glib::spawn_future_local čita s ovog kanala.
async-channel = "2"

chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
